<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chat DUQUEL</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0b141a;
      color: #e9edef;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    .chat-container {
      width: 100%;
      max-width: 480px;
      height: 100vh;
      background-color: #0b141a;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .user-modal {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #111b21;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 20px; z-index: 10;
    }
    .user-modal h2 { color: #00a884; margin-bottom: 20px; font-size: 20px; }
    .user-modal input {
      width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #2a3942;
      background-color: #202c33; color: #e9edef; font-size: 16px; margin-bottom: 15px; outline: none;
    }
    .user-modal button {
      width: 100%; padding: 12px; border-radius: 8px; border: none;
      background-color: #00a884; color: #111b21; font-weight: bold; font-size: 16px; cursor: pointer;
    }
    .chat-header {
      background-color: #202c33; padding: 10px 16px; display: flex; align-items: center; gap: 12px;
    }
    .avatar {
      width: 40px; height: 40px; border-radius: 50%; background-color: #00a884;
      display: flex; align-items: center; justify-content: center; font-weight: bold; color: #111b21;
    }
    .header-info h3 { font-size: 16px; color: #e9edef; }
    .header-info p { font-size: 12px; color: #8696a0; }
    .chat-messages {
      flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
      background-color: #0b141a;
    }
    .message {
      max-width: 80%; padding: 8px 12px; border-radius: 8px; font-size: 14px;
      line-height: 18px; position: relative; word-wrap: break-word;
    }
    .message.received { align-self: flex-start; background-color: #202c33; }
    .message.sent { align-self: flex-end; background-color: #005c4b; }
    .message-sender { font-size: 11px; font-weight: bold; color: #53bdeb; margin-bottom: 3px; }
    .reply-quote {
      background: rgba(0,0,0,0.2); border-left: 3px solid #00a884; padding: 4px 8px;
      border-radius: 4px; margin-bottom: 6px; font-size: 12px; color: #8696a0;
    }
    .message-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; gap: 10px; }
    .message-time { font-size: 10px; color: #8696a0; }
    .msg-actions { display: flex; gap: 8px; font-size: 11px; }
    .action-btn { cursor: pointer; opacity: 0.7; }
    .action-btn:hover { opacity: 1; }
    .reply-preview {
      background-color: #111b21; padding: 8px 12px; display: none; justify-content: space-between;
      align-items: center; border-left: 4px solid #00a884; font-size: 13px; color: #8696a0;
    }
    
    .chat-input-container {
      background-color: #202c33;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      position: sticky;
      bottom: 0;
      width: 100%;
      z-index: 5;
    }
    .chat-input {
      flex: 1;
      background-color: #2a3942;
      border: 1px solid transparent;
      border-radius: 20px;
      padding: 12px 16px;
      color: #e9edef;
      font-size: 16px; 
      outline: none;
      -webkit-appearance: none;
    }
    .chat-input:focus {
      border-color: #00a884;
    }
    .send-btn {
      background-color: #00a884;
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background-color 0.2s ease;
    }
    .send-btn:active {
      background-color: #008f6f;
    }
    .send-btn svg {
      fill: #111b21;
      width: 20px;
      height: 20px;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="user-modal" id="userModal">
      <h2>Ingresa tu nombre</h2>
      <input type="text" id="usernameInput" placeholder="Ej. Juan" required>
      <button onclick="guardarNombre()">Entrar al Chat</button>
    </div>

    <div class="chat-header">
      <div class="avatar">D</div>
      <div class="header-info">
        <h3>Grupo DUQUEL</h3>
        <p>Chat interactivo en vivo</p>
      </div>
    </div>

    <div class="chat-messages" id="chatMessages"></div>

    <div class="reply-preview" id="replyPreview">
      <span id="replyText">Respondiendo a...</span>
      <span style="cursor:pointer; font-weight:bold; font-size:16px;" onclick="cancelarRespuesta()">✕</span>
    </div>

    <form class="chat-input-container" id="messageForm">
      <input 
        type="text" 
        class="chat-input" 
        id="messageInput" 
        placeholder="Escribe un mensaje aquí..." 
        autocomplete="off" 
        required 
        enterkeyhint="send"
      >
      <button type="submit" class="send-btn" aria-label="Enviar mensaje">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
      </button>
    </form>
  </div>

  <script>
    const SUPABASE_URL = 'https://aostkmwlqecnndnpajpl.supabase.co';
    const SUPABASE_ANON_KEY = 'EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFvc3RrbXdscWVjbm5kbnBhanBsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1NDE2MDgsImV4cCI6MjEwMzExNzYwOH0.oxLl3qxt91wgKR5_r1VCYit8xxEz1uN9d6QF_QEfADo';

    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let usuarioActual = localStorage.getItem('chat_usuario') || '';
    let respuestaActual = null;

    if (usuarioActual) document.getElementById('userModal').style.display = 'none';

    function guardarNombre() {
      const input = document.getElementById('usernameInput').value.trim();
      if (input) {
        usuarioActual = input;
        localStorage.setItem('chat_usuario', usuarioActual);
        document.getElementById('userModal').style.display = 'none';
      }
    }

    async function cargarMensajes() {
      const { data, error } = await _supabase.from('DUQUEL').select('*').order('created_at', { ascending: true });
      if (!error && data) {
        const container = document.getElementById('chatMessages');
        container.innerHTML = '';
        
        data.forEach(msg => {
          const esPropio = msg.nombre === usuarioActual;
          const hora = msg.created_at ? new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';

          const msgDiv = document.createElement('div');
          msgDiv.className = `message ${esPropio ? 'sent' : 'received'}`;
          
          let html = '';
          // Muestra quién envió el mensaje
          if (!esPropio) html += `<div class="message-sender">${msg.nombre || 'Anónimo'}</div>`;
          
          // Muestra si es una respuesta a otro mensaje
          if (msg.mensaje && msg.mensaje.includes('::REPLY::')) {
            const partes = msg.mensaje.split('::REPLY::');
            html += `<div class="reply-quote">${partes[0]}</div><div>${partes[1]}</div>`;
          } else {
            // Muestra el mensaje normal (qué)
            html += `<div>${msg.mensaje || ''}</div>`;
          }

          html += `
            <div class="message-footer">
              <div class="msg-actions">
                <span class="action-btn" onclick="prepararRespuesta('${msg.nombre}', '${msg.mensaje}')">↩ Responder</span>
                ${esPropio ? `<span class="action-btn" style="color:#ff5555;" onclick="borrarMensaje(${msg.id})">🗑 Borrar</span>` : ''}
              </div>
              <!-- Muestra la hora (cuándo) -->
              <div class="message-time">${hora}</div>
            </div>
          `;

          msgDiv.innerHTML = html;
          container.appendChild(msgDiv);
        });
        container.scrollTop = container.scrollHeight;
      }
    }

    function prepararRespuesta(autor, texto) {
      respuestaActual = `${autor}: ${texto.replace(/::REPLY::.*/, '')}`;
      document.getElementById('replyText').innerText = `Respondiendo a ${respuestaActual}`;
      document.getElementById('replyPreview').style.display = 'flex';
      document.getElementById('messageInput').focus();
    }

    function cancelarRespuesta() {
      respuestaActual = null;
      document.getElementById('replyPreview').style.display = 'none';
    }

    async function borrarMensaje(id) {
      if (confirm("¿Seguro que quieres borrar este mensaje?")) {
        await _supabase.from('DUQUEL').delete().eq('id', id);
        cargarMensajes();
      }
    }

    document.getElementById('messageForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const input = document.getElementById('messageInput');
      let texto = input.value.trim();

      if (texto && usuarioActual) {
        if (respuestaActual) {
          texto = `${respuestaActual}::REPLY::${texto}`;
          cancelarRespuesta();
        }

        input.value = '';
        const { error } = await _supabase.from('DUQUEL').insert([{ nombre: usuarioActual, mensaje: texto }]);
        if (!error) cargarMensajes();
      }
    });

    cargarMensajes();
    setInterval(cargarMensajes, 3000); // Recarga mensajes cada 3 segundos
  </script>
</body>
</html>
